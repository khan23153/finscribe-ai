name: Android APK
on:
  workflow_dispatch:
    inputs:
      app_origin:
        description: HTTPS origin of the FinScribe deployment this APK should open
        required: true
        default: https://finscribe-ai.vercel.app
  pull_request:
    paths: ['android/**', 'scripts/verify-android-config.mjs', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ORIGIN: ${{ inputs.app_origin || 'https://finscribe-ai.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/wrapper-validation@v4
      - name: Install pinned Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug --no-daemon "-PfinscribeOrigin=$APP_ORIGIN"
      - name: Inspect package and signing certificate
        run: |
          mkdir -p android-artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk android-artifact/finscribe-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android-artifact/finscribe-debug.apk > android-artifact/signing-certificate.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android-artifact/finscribe-debug.apk > android-artifact/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree android-artifact/finscribe-debug.apk AndroidManifest.xml > android-artifact/manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump --values resources android-artifact/finscribe-debug.apk > android-artifact/resources.txt
          node scripts/verify-android-config.mjs --origin "$APP_ORIGIN" --badging android-artifact/badging.txt --manifest android-artifact/manifest.txt --certificate android-artifact/signing-certificate.txt --resources android-artifact/resources.txt > android-artifact/package-info.json
          sha256sum android-artifact/finscribe-debug.apk > android-artifact/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: finscribe-debug-apk
          path: android-artifact/
          if-no-files-found: error
